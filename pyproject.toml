[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "opynsees2000"
version = "0.2.0"
description = "GUI tipo SAP2000 para modelado estructural con OpenSeesPy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "OPynSees2000 Contributors"},
]
keywords = ["opensees", "structural-engineering", "gui", "fem", "earthquake"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "PySide6>=6.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "numpy>=1.24",
]

[project.optional-dependencies]
analysis = [
    "openseespy>=3.5",
]
plotting = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "ruff>=0.1",
]

[project.scripts]
opynsees2000 = "gui.main:main"

[project.gui-scripts]
opynsees2000-gui = "gui.main:main"

[project.urls]
Homepage = "https://github.com/your-user/OPynSees2000"
Documentation = "https://github.com/your-user/OPynSees2000/tree/main/docs"
Repository = "https://github.com/your-user/OPynSees2000"

[tool.setuptools.packages.find]
include = ["gui*"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
